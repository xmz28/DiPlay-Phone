name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      standalone_test_apk:
        description: Build an installable test APK using the published 0.2.11 runtime identity
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        if: github.event_name != 'workflow_dispatch' || !inputs.standalone_test_apk
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Build standalone phone test APK
        if: github.event_name == 'workflow_dispatch' && inputs.standalone_test_apk
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/DiPlay-0.2.11.apk" \
            https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.11/DiPlay-0.2.11.apk
          echo "57a3f5daf02af82f636baee26f28a475e04013de8174176c62d97d300498e4c9  $RUNNER_TEMP/DiPlay-0.2.11.apk" | sha256sum --check
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(os.environ['RUNNER_TEMP']) / 'diplay-test-runtime'
          with ZipFile(Path(os.environ['RUNNER_TEMP']) / 'DiPlay-0.2.11.apk') as apk:
              for name in ('identity.pk8', 'certificate.p7b'):
                  target = root / 'offline-mfi' / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(apk.read('assets/offline-mfi/' + name))
                  assert target.stat().st_size > 0
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('DIPLAY_AUTH_ASSETS_DIR=' + str(root) + '\n')
          PY
          DIPLAY_AUTH_ASSETS_DIR="$RUNNER_TEMP/diplay-test-runtime" ./gradlew :mobile:assembleStandaloneDebug --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs mobile/build/outputs/apk/debug/mobile-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging mobile/build/outputs/apk/debug/mobile-debug.apk > "$RUNNER_TEMP/phone-test-badging.txt"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          from zipfile import ZipFile
          badging = (Path(os.environ['RUNNER_TEMP']) / 'phone-test-badging.txt').read_text()
          assert "package: name='com.shihab.diplay.hudtest' versionCode='32' versionName='0.2.11-fusion-ble-debug.3'" in badging
          print(badging.splitlines()[0])
          apk_path = Path('mobile/build/outputs/apk/debug/mobile-debug.apk')
          runtime = Path(os.environ['RUNNER_TEMP']) / 'diplay-test-runtime' / 'offline-mfi'
          with ZipFile(apk_path) as apk:
              for name in ('identity.pk8', 'certificate.p7b'):
                  assert apk.read('assets/offline-mfi/' + name) == (runtime / name).read_bytes()
              assert any(name.startswith('lib/arm64-v8a/') and name.endswith('.so') for name in apk.namelist())
          output = Path('mobile/build/outputs/standalone-test')
          output.mkdir(parents=True, exist_ok=True)
          target = output / 'DiPlay-fusion-ble-debug.apk'
          target.write_bytes(apk_path.read_bytes())
          (output / 'SHA256SUMS.txt').write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name + '\n')
          (output / 'SOURCE.txt').write_text('Source commit: ' + os.environ['GITHUB_SHA'] + '\nPackage: com.shihab.diplay.hudtest\nVersion: 0.2.11-fusion-ble-debug.3 (32)\nUpstream main snapshot: e6e7cc0eaf175ef397eee7ac6223eb267cdc68bd\nUpstream release commit: 6014025c653c4dae88d319ce446e0bf1ddb658ea\nRuntime identity: published DiPlay 0.2.11\n')
          print('Verified runtime identity assets and arm64 libraries in standalone APK')
          PY
      - name: Upload standalone test APK
        if: github.event_name == 'workflow_dispatch' && inputs.standalone_test_apk
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-standalone-test-apk
          path: mobile/build/outputs/standalone-test/
          if-no-files-found: error
      - name: Test reports
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.standalone_test_apk)
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
